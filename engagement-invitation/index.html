<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>إسلام و ميادة</title>
<meta name="description" content="Eslam & Mayade — Engagement Invitation · دعوة خطوبة إسلام و ميادة">
<meta name="theme-color" content="#FDF8F4">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Great+Vibes&family=Lora:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Tajawal:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/envelope.css">
<link rel="stylesheet" href="css/gallery.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body class="locked">
<div class="progress" id="progress" aria-hidden="true"></div>

<!-- SVG sprite: floral sprig + icons -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <defs>
  <radialGradient id="rg" cx="50%" cy="45%" r="65%"><stop offset="0" stop-color="#F6E1DD"/><stop offset=".55" stop-color="#DDA8AE"/><stop offset="1" stop-color="#A9525F"/></radialGradient>
  <radialGradient id="rg2" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#C06C78"/><stop offset="1" stop-color="#7C2535"/></radialGradient>
  <ellipse id="rp" cx="100" cy="52" rx="30" ry="36"/></defs>
 <symbol id="rose" viewBox="0 0 200 200">
  <g fill="#8FA08A" opacity=".9"><path d="M100 100C58 66 28 78 10 104C38 126 80 126 100 100Z"/><path d="M100 100C142 70 174 82 190 108C162 128 120 126 100 100Z"/></g>
  <g fill="url(#rg)" stroke="#8F3B4B" stroke-opacity=".35" stroke-width="1">
   <use href="#rp"/><use href="#rp" transform="rotate(60 100 100)"/><use href="#rp" transform="rotate(120 100 100)"/><use href="#rp" transform="rotate(180 100 100)"/><use href="#rp" transform="rotate(240 100 100)"/><use href="#rp" transform="rotate(300 100 100)"/>
   <use href="#rp" transform="rotate(30 100 100) translate(100 100) scale(.7) translate(-100 -100)"/><use href="#rp" transform="rotate(102 100 100) translate(100 100) scale(.7) translate(-100 -100)"/><use href="#rp" transform="rotate(174 100 100) translate(100 100) scale(.7) translate(-100 -100)"/><use href="#rp" transform="rotate(246 100 100) translate(100 100) scale(.7) translate(-100 -100)"/><use href="#rp" transform="rotate(318 100 100) translate(100 100) scale(.7) translate(-100 -100)"/>
  </g>
  <g fill="url(#rg2)" stroke="#6E1A2D" stroke-opacity=".35" stroke-width="1">
   <use href="#rp" transform="rotate(15 100 100) translate(100 100) scale(.42) translate(-100 -100)"/><use href="#rp" transform="rotate(105 100 100) translate(100 100) scale(.42) translate(-100 -100)"/><use href="#rp" transform="rotate(195 100 100) translate(100 100) scale(.42) translate(-100 -100)"/><use href="#rp" transform="rotate(285 100 100) translate(100 100) scale(.42) translate(-100 -100)"/>
  </g><circle cx="100" cy="100" r="8" fill="url(#rg2)"/></symbol>

 <symbol id="sprig" viewBox="0 0 120 170" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M60 168C56 120 68 70 60 26"/>
  <path d="M58 134C34 132 20 112 24 94C46 96 58 112 58 134Z"/><path d="M62 108C86 105 100 87 96 69C74 71 62 87 62 108Z"/><path d="M59 80C42 76 32 62 36 48C52 51 59 64 59 80Z"/>
  <g transform="translate(60 16)"><circle r="3"/><ellipse rx="4" ry="10" cy="-11"/><ellipse rx="4" ry="10" cy="-11" transform="rotate(72)"/><ellipse rx="4" ry="10" cy="-11" transform="rotate(144)"/><ellipse rx="4" ry="10" cy="-11" transform="rotate(216)"/><ellipse rx="4" ry="10" cy="-11" transform="rotate(288)"/></g>
 </symbol>
 <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 01-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1121 11.5z"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 00-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 000-7.8z"/></symbol>
 </g>
</svg>

<!-- ============ 1. 3D ENVELOPE INTRO ============ -->
<div class="intro" id="intro" role="dialog" aria-modal="true" aria-label="Invitation">
 <button class="chip intro-lang" type="button" data-lang-toggle data-i18n="lang.btn"></button>
 <svg class="deco d1" viewBox="0 0 200 200" aria-hidden="true"><use href="#rose"/></svg>
 <svg class="deco d2" viewBox="0 0 200 200" aria-hidden="true"><use href="#rose"/></svg>
 <svg class="deco d3" viewBox="0 0 200 200" aria-hidden="true"><use href="#rose"/></svg>
 <svg class="deco d4" viewBox="0 0 200 200" aria-hidden="true"><use href="#rose"/></svg>
 <div class="intro-stage">
  <p class="intro-kicker" data-i18n="intro.invited"></p>
  <div class="env-wrap">
   <div class="envelope" id="envelope">
    <div class="env-back"></div>
    <div class="env-card"><div class="card-in">
      <span class="card-mono">E <i>&amp;</i> M</span>
      <span class="card-names" data-i18n="names"></span>
      <span class="card-date" data-date="short"></span>
    </div></div>
    <div class="env-front"></div>
    <div class="env-flap"></div>
    <button class="seal" id="seal" type="button" data-i18n-aria="intro.open"><span>E<i>&amp;</i>M</span></button>
   </div>
  </div>
  <button class="btn btn-gold" id="openBtn" type="button" data-i18n="intro.open"></button>
 </div>
</div>

<canvas id="sparkles" aria-hidden="true"></canvas>

<!-- ============ NAV ============ -->
<header class="nav" id="nav">
 <a class="brand" href="#home" aria-label="E &amp; M">E<span>&amp;</span>M</a>
 <nav class="menu" id="navMenu" data-i18n-aria="nav.menu">
  <a href="#home" data-i18n="nav.home"></a><a href="#story" data-i18n="nav.story"></a>
  <a href="#date" data-i18n="nav.date"></a><a href="#location" data-i18n="nav.location"></a><a href="#rsvp" data-i18n="nav.rsvp"></a>
 </nav>
 <div class="nav-actions">
  <button class="chip" type="button" data-lang-toggle data-i18n="lang.btn"></button>
  <button class="burger" id="burger" type="button" aria-expanded="false" aria-controls="navMenu" data-i18n-aria="nav.menu"><svg class="i"><use href="#i-menu"/></svg></button>
 </div>
</header>

<main id="main">

<!-- ============ 2. ENGAGEMENT ANNOUNCEMENT ============ -->
<section class="hero" id="home">
 <svg class="deco wm" viewBox="0 0 200 200" aria-hidden="true"><use href="#rose"/></svg>
 <div class="frame" aria-hidden="true"></div>
 <svg class="deco h1" viewBox="0 0 200 200" aria-hidden="true"><use href="#rose"/></svg>
 <svg class="deco h2" viewBox="0 0 200 200" aria-hidden="true"><use href="#rose"/></svg>
 <div class="hero-in reveal">
  <p class="eyebrow" data-i18n="hero.eyebrow"></p>
  <h1 class="names"><span data-i18n="groom"></span><span class="amp" data-i18n="amp"></span><span data-i18n="bride"></span></h1>
  <div class="divider" aria-hidden="true"><svg class="i"><use href="#i-heart"/></svg></div>
  <p class="lead" data-i18n="hero.message" data-split></p>
  <p class="hero-date" data-date="long"></p>
  <a class="btn" href="#date" data-i18n="hero.cta"></a>
 </div>
</section>

<!-- ============ 3. CHILDHOOD MEMORIES ============ -->
<section class="section story" id="story"><svg class="deco sd1" viewBox="0 0 200 200" aria-hidden="true"><use href="#rose"/></svg><svg class="deco sd2" viewBox="0 0 200 200" aria-hidden="true"><use href="#rose"/></svg><div class="wrap">
 <h2 class="title reveal" data-i18n="story.title"></h2>
 <p class="sub reveal" data-i18n="story.sub"></p>
 <!-- YOUR 6 CHILDHOOD PHOTOS (the two of you together): drop assets/images/gallery/1.jpg … 6.jpg — they appear automatically -->
 <div class="g-grid" id="galleryGrid"></div>
 <p class="quote reveal" data-i18n="story.quote" data-split></p>
</div></section>

<!-- ============ 5. DATE & COUNTDOWN ============ -->
<section class="section date" id="date"><div class="wrap">
 <h2 class="title reveal" data-i18n="date.title"></h2>
 <div class="countdown reveal" id="countdown" hidden>
  <div class="cd" data-unit="days"><b>00</b><span data-i18n="date.days"></span></div>
  <div class="cd" data-unit="hours"><b>00</b><span data-i18n="date.hours"></span></div>
  <div class="cd" data-unit="minutes"><b>00</b><span data-i18n="date.minutes"></span></div>
  <div class="cd" data-unit="seconds"><b>00</b><span data-i18n="date.seconds"></span></div>
 </div>
 <p class="note" id="countdownNote" role="status"></p>
 <div class="calendar reveal" id="calendar">
  <i class="corner c1"></i><i class="corner c2"></i><i class="corner c3"></i><i class="corner c4"></i>
  <p class="cal-month" id="calMonth"></p>
  <div class="cal-grid" id="calGrid"></div>
 </div>
 <p class="time-line" id="timeLine"></p>
 <a class="addcal" id="addCal" href="#" target="_blank" rel="noopener noreferrer" data-i18n="date.addcal"></a>
 <a class="btn btn-gold btn-wide" href="#rsvp" data-i18n="date.confirm"></a>
</div></section>

<!-- ============ 6. LOCATION ============ -->
<section class="section location" id="location"><svg class="deco sd1" viewBox="0 0 200 200" aria-hidden="true"><use href="#rose"/></svg><svg class="deco sd2" viewBox="0 0 200 200" aria-hidden="true"><use href="#rose"/></svg><div class="wrap">
 <h2 class="title reveal" data-i18n="loc.title"></h2>
 <div class="loc-card reveal">
  <span class="pin"><svg class="i"><use href="#i-pin"/></svg></span>
  <p class="venue" data-i18n="venue.name"></p>
  <p class="addr" data-i18n="venue.address"></p>
  <a class="btn btn-gold" id="dirBtn" href="#" target="_blank" rel="noopener noreferrer"><svg class="i"><use href="#i-pin"/></svg><span data-i18n="loc.directions"></span></a>
 </div>
</div></section>

<!-- ============ 7. RSVP ============ -->
<section class="section rsvp" id="rsvp"><svg class="deco sd1" viewBox="0 0 200 200" aria-hidden="true"><use href="#rose"/></svg><svg class="deco sd2" viewBox="0 0 200 200" aria-hidden="true"><use href="#rose"/></svg><div class="wrap narrow">
 <h2 class="title reveal" data-i18n="rsvp.title"></h2>
 <p class="sub reveal" data-i18n="rsvp.sub"></p>
 <form class="rsvp-form reveal" id="rsvpForm" novalidate>
  <label class="field"><span data-i18n="rsvp.name"></span><input type="text" name="name" id="rsvpName" autocomplete="name" required data-i18n-ph="rsvp.namePh"></label>
  <fieldset class="field"><legend data-i18n="rsvp.attend"></legend>
   <div class="segs">
    <label class="seg"><input type="radio" name="attending" value="yes" checked><span data-i18n="rsvp.yes"></span></label>
    <label class="seg"><input type="radio" name="attending" value="no"><span data-i18n="rsvp.no"></span></label>
   </div>
  </fieldset>
  <label class="field" id="guestsField"><span data-i18n="rsvp.guests"></span><select name="guests" id="rsvpGuests"></select></label>
  <label class="field"><span data-i18n="rsvp.note"></span><textarea name="note" rows="3" data-i18n-ph="rsvp.notePh"></textarea></label>
  <button class="btn btn-gold" type="submit" data-i18n="rsvp.send"></button>
  <p class="status" id="rsvpStatus" role="status" aria-live="polite"></p>
 </form>
</div></section>

</main>

<footer class="footer">
 <svg class="deco f1" viewBox="0 0 200 200" aria-hidden="true"><use href="#rose"/></svg>
 <p class="f-names" data-i18n="names"></p>
 <p class="f-date" data-date="long"></p>
 <a class="btn" id="shareBtn" href="#" target="_blank" rel="noopener noreferrer"><svg class="i"><use href="#i-chat"/></svg><span data-i18n="share.btn"></span></a>
 <p class="f-line" data-i18n="footer.line"></p>
</footer>

<!-- Floating controls -->
<button class="fab fab-music" id="musicBtn" type="button" hidden aria-pressed="false"><svg class="i"><use href="#i-music"/></svg></button>
<button class="fab fab-top" id="topBtn" type="button" hidden data-i18n-aria="top"><svg class="i"><use href="#i-up"/></svg></button>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" dir="ltr" role="dialog" aria-modal="true" hidden>
 <button class="lb-btn lb-close" id="lbClose" type="button" data-i18n-aria="gallery.close"><svg class="i"><use href="#i-x"/></svg></button>
 <button class="lb-btn lb-prev" id="lbPrev" type="button" data-i18n-aria="gallery.prev"><svg class="i"><use href="#i-prev"/></svg></button>
 <figure class="lb-fig"><img id="lbImg" alt=""><figcaption id="lbCap"></figcaption></figure>
 <button class="lb-btn lb-next" id="lbNext" type="button" data-i18n-aria="gallery.next"><svg class="i"><use href="#i-next"/></svg></button>
 <p class="lb-count" id="lbCount"></p>
</div>

<script src="js/config.js"></script>
<script src="js/translations.js"></script>
<script src="js/countdown.js"></script>
<script src="js/calendar.js"></script>
<script src="js/music.js"></script>
<script src="js/animations.js"></script>
<script src="js/photos.js"></script>
<script src="js/gallery.js"></script>
<script src="js/main.js"></script>
</body>
</html>
